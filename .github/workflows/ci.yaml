name: CI

on:
  push:
    branches: [ main, '0*-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore NetRts.sln

    - name: Build
      run: dotnet build NetRts.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test --solution NetRts.sln --no-build --configuration Release

  python-sample:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Byte-compile sample bot
      run: python -m py_compile samples/python/bot.py
