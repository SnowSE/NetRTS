name: CI

on:
  push:
    branches: [ main, '0*-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore NetRts.sln

    - name: Build
      run: dotnet build NetRts.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test --solution NetRts.sln --no-build --configuration Release

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Publish server image
      # ContainerImageTags comes from env because a ';' on the command line splits the property
      run: >
        dotnet publish src/NetRts.Server --configuration Release -t:PublishContainer
        -p:ContainerRegistry=docker.io
        -p:ContainerRepository=snowcollege/netrts
      env:
        ContainerImageTags: latest;sha-${{ github.sha }}

  python-sample:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Byte-compile sample bot
      run: python -m py_compile samples/python/bot.py
