name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore NetRts.sln

    - name: Build
      run: dotnet build NetRts.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test --solution NetRts.sln --no-build --configuration Release

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Publish server image
      # ContainerImageTags comes from env because a ';' on the command line splits the property
      run: >
        dotnet publish src/NetRts.Server --configuration Release -t:PublishContainer
        -p:ContainerRegistry=docker.io
        -p:ContainerRepository=snowcollege/netrts
      env:
        ContainerImageTags: latest;sha-${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    # Live matches are held in memory, so don't let two deploys restart the app at once
    concurrency: azure-app-service
    permissions:
      id-token: write   # OIDC sign-in to Azure through the id-netrts-github managed identity
      contents: read

    steps:
    - uses: actions/checkout@v7   # the recap job's image is built from recap/

    - name: Log in to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy image to App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: netrts-jallen
        images: docker.io/snowcollege/netrts:sha-${{ github.sha }}

    - name: Build the nightly recap job's image and point the job at it
      # In the job's own registry (az acr build: no Docker needed). Skipped until the recap
      # resources exist (deploy/recap/setup.sh, see docs/deploying.md).
      run: |
        az config set extension.use_dynamic_install=yes_without_prompt
        registry=$(az acr list -g rg-netrts --query "[?starts_with(name, 'netrtsrecap')].name | [0]" -o tsv)
        if [ -z "$registry" ] || ! az containerapp job show -g rg-netrts -n netrts-recap --query name -o tsv > /dev/null 2>&1; then
          echo "No recap job in rg-netrts yet; nothing to build."
          exit 0
        fi
        az acr build -r "$registry" -t netrts-recap:sha-${{ github.sha }} -t netrts-recap:latest recap --no-logs -o none
        az containerapp job update -g rg-netrts -n netrts-recap --image "$registry.azurecr.io/netrts-recap:sha-${{ github.sha }}" -o none

  python-sample:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Byte-compile sample bot
      run: python -m py_compile samples/python/bot.py

  csharp-sample:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build the starter bot
      run: dotnet build samples/csharp/StarterBot.cs
