<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recap host portraits</title>
<!-- Served (by render-hosts.mjs) from a running game server, so it loads the game's own three.js and models. -->
<script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/addons/" } }
</script>
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildModels, entityMaterial } from '/3d/models.js';

const models = buildModels(true);   // the Snow College badgers
const material = entityMaterial();

// Each host: unit, team colour, pose (the unit shader's walk = (phase, leg swing, arm swing) and
// bow draw = (raise, pull)) and which way it turns to the camera.
const HOSTS = {
  zip: { unit: 'Scout', team: '#56b4e9', walk: [1.1, 0.55, 0.25], draw: [0, 0], turn: 1.05, focus: 0.34, dist: 1.75, lift: 0.2 },
  sarge: { unit: 'Soldier', team: '#e69f00', walk: [0, 0, 0], draw: [0, 0], turn: 0.3, focus: 0.27, dist: 1.3, lift: 0.15 },
  quill: { unit: 'Archer', team: '#2fc497', walk: [0, 0, 0], draw: [0, 0], turn: 0.45, focus: 0.27, dist: 1.3, lift: 0.15 },
};

function piece(h) {
  const m = models.units[h.unit];
  const geo = m.geo.clone();
  const attr = (n, size, values) => geo.setAttribute(n, new THREE.InstancedBufferAttribute(new Float32Array(values), size));
  const c = new THREE.Color(h.team);
  attr('iTeam', 3, [c.r, c.g, c.b]);
  attr('iFlash', 1, [0]);
  attr('iCut', 1, [1000]);
  attr('iWalk', 3, h.walk);
  attr('iDraw', 2, h.draw);
  const mesh = new THREE.InstancedMesh(geo, material, 1);
  const s = m.scale ?? 1;
  mesh.setMatrixAt(0, new THREE.Matrix4().compose(new THREE.Vector3(), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, h.turn, 0)), new THREE.Vector3(s, s, s)));
  mesh.castShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}

/** One host, studio-lit with a soft contact shadow, on a transparent background, as a PNG data URL. */
window.renderHost = (key, size) => {
  const h = HOSTS[key];
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(size, size);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x3a3026, 1.1));
  const key_ = new THREE.DirectionalLight(0xfff1dc, 2.6);
  key_.position.set(1.4, 2.2, 2.0);
  key_.castShadow = true;
  key_.shadow.mapSize.set(4096, 4096);
  Object.assign(key_.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5 });
  key_.shadow.radius = 6;
  key_.shadow.bias = -0.0004;
  scene.add(key_);
  const rim = new THREE.DirectionalLight(0x9fc8ff, 1.6);
  rim.position.set(-1.6, 1.4, -1.8);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.45);
  fill.position.set(-2, 0.6, 2);
  scene.add(fill);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.32 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  scene.add(piece(h));

  const camera = new THREE.PerspectiveCamera(26, 1, 0.01, 50);
  const target = new THREE.Vector3(0, h.focus, 0);
  camera.position.set(h.dist * 0.2, h.focus + h.lift, h.dist);
  camera.lookAt(target);
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  renderer.dispose();
  return url;
};
window.ready = true;
</script>
</body>
</html>
