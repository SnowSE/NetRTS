apiVersion: v1
kind: Secret
metadata:
  name: netrts-secrets
type: Opaque
stringData:
  # Base64 encoded values in real deployment
  ConnectionStrings__netrtsdb: "Host=netrts-db;Database=netrts;Username=postgres;Password=change-me-in-production"
  JwtSettings__SecretKey: "change-me-to-a-secure-random-key-minimum-32-chars-long"
  POSTGRES_PASSWORD: "change-me-in-production"
