apiVersion: apps/v1
kind: Deployment
metadata:
  name: netrts-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netrts-client
  template:
    metadata:
      labels:
        app: netrts-client
    spec:
      containers:
      - name: client
        image: netrts-client:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: netrts-client
spec:
  selector:
    app: netrts-client
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
