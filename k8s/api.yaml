apiVersion: apps/v1
kind: Deployment
metadata:
  name: netrts-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netrts-api
  template:
    metadata:
      labels:
        app: netrts-api
    spec:
      containers:
      - name: api
        image: netrts-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: netrts-config
        - secretRef:
            name: netrts-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: netrts-api
spec:
  selector:
    app: netrts-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
