<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>NetRts</title>
  <meta name="description" content="Watch bots fight real-time strategy matches over a REST API.">
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23213440'/%3E%3Crect x='3' y='3' width='5' height='5' fill='%23E69F00'/%3E%3Ccircle cx='11.5' cy='11.5' r='2.5' fill='%2356B4E9'/%3E%3C/svg%3E">
  <script>
    // Colour theme and brand (original NetRts or the Snow College theme, the default) before first paint.
    try { const t = localStorage.getItem('netrts-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    let brand = 'snow';
    try { if (localStorage.getItem('netrts-brand') === 'classic') brand = 'classic'; } catch {}
    document.documentElement.dataset.brand = brand;
    if (brand === 'snow') {
      document.title = 'Badger Brawl';
      document.getElementById('favicon').href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%2300447c'/%3E%3Ccircle cx='5' cy='6' r='2.4' fill='%23c9d3de'/%3E%3Ccircle cx='19' cy='6' r='2.4' fill='%23c9d3de'/%3E%3Cpath d='M2.5 7.5Q12 1.5 21.5 7.5L13.6 21Q12 22.8 10.4 21Z' fill='%23fff'/%3E%3Cpath d='M6.2 5.4L10.7 19.4 11.5 19.6 9.4 4.4ZM17.8 5.4L13.3 19.4 12.5 19.6 14.6 4.4Z' fill='%230f1d2e'/%3E%3Ccircle cx='12' cy='20.2' r='1.7' fill='%230f1d2e'/%3E%3C/svg%3E";
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
  <script type="module" src="theme.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand only-classic" href="#/" aria-label="NetRts home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="9" height="9" class="bm-a"/>
        <circle cx="17.5" cy="17.5" r="4.5" class="bm-b"/>
        <path d="M13 6.5h8M17 2.5v8M2 17.5h9" class="bm-line"/>
      </svg>
      <span>NetRts</span>
    </a>
    <a class="brand only-snow" href="#/" aria-label="Badger Brawl home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5" cy="6" r="2.4" class="bm-ear"/>
        <circle cx="19" cy="6" r="2.4" class="bm-ear"/>
        <path d="M2.5 7.5Q12 1.5 21.5 7.5L13.6 21Q12 22.8 10.4 21Z" class="bm-face"/>
        <path d="M6.2 5.4L10.7 19.4 11.5 19.6 9.4 4.4ZM17.8 5.4L13.3 19.4 12.5 19.6 14.6 4.4Z" class="bm-stripe"/>
        <circle cx="12" cy="20.2" r="1.7" class="bm-nose"/>
      </svg>
      <span>Badger Brawl<small>Snow College</small></span>
    </a>
    <nav aria-label="Primary">
      <a href="#/"><span class="only-classic">Matches</span><span class="only-snow">Brawls</span></a>
      <a href="/scalar">API docs</a>
      <button type="button" class="theme-toggle" id="brand-toggle" aria-label="Site theme: Snow College. Click for the original theme.">
        <span class="only-snow">Original theme</span><span class="only-classic">Snow College theme</span>
      </button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Colour theme: automatic">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
        <span id="theme-label">Auto</span>
      </button>
    </nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot only-classic">
    <p>NetRts: a tick-based strategy engine for bot programming contests. Bots play over HTTP, people watch here.</p>
  </footer>
</body>
</html>
